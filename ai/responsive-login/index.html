<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Page Title -->
    <title>Responsive Login | Modern Design</title>
    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="main-wrapper">
        <div class="login-card">
            <!-- Header Section -->
            <div class="header">
                <h2>Welcome Back</h2>
                <p>Enter your details to access your account</p>
            </div>

            <!-- Login Form -->
            <form action="#">
                <!-- Email Field -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-icon">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" id="email" placeholder="example@mail.com" required>
                    </div>
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <div class="label-box">
                        <label for="password">Password</label>
                        <a href="#" class="forgot-pass">Forgot?</a>
                    </div>
                    <div class="input-icon">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>
                </div>

                <!-- Remember Me & Submit -->
                <div class="form-footer">
                    <label class="checkbox-container">
                        <input type="checkbox">
                        <span class="mark"></span>
                        Remember me
                    </label>
                </div>

                <button type="submit" class="submit-btn">Sign In</button>

                <!-- Social Login Divider -->
                <div class="divider">
                    <span>or sign in with</span>
                </div>

                <!-- Social Media Buttons -->
                <div class="social-links">
                    <button type="button" class="social-item"><i class="fa-brands fa-google"></i> Google</button>
                    <button type="button" class="social-item"><i class="fa-brands fa-facebook-f"></i> Facebook</button>
                </div>
            </form>

            <!-- Sign Up Link -->
            <div class="footer-link">
                Don't have an account? <a href="#">Create one</a>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
